server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reverse proxy for API requests to the backend server
  location /api {
    proxy_pass https://msc-prod-server-gzgxacashugfbye8.southeastasia-01.azurewebsites.net;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # ALWAYS force browsers to check for a new index.html to ensure users get the latest version of the app
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
  }

  # Allow long-term caching for hashed static JS/CSS assets
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Handle React Router's client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}